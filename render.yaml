services:

  - type: web
    name: memorymate-api
    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: DATABASE_URL
        sync: false

      - key: OLLAMA_URL
        sync: false

      - key: GEMMA_MODEL
        value: gemma3:4b

      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2